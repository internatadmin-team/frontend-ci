# Modele traite au demarrage du conteneur par envsubst : seules les variables definies dans
# l'environnement sont remplacees (BACKEND_URL, NGINX_LOCAL_RESOLVERS). Les variables Nginx restent intactes.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS de l'environnement du conteneur, avec une duree courte : apres un redeploiement du backend,
    # sa nouvelle adresse est prise en compte sans redemarrer Nginx
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # le backend accepte 3 Mo : la marge laisse le backend repondre lui-meme en cas de depassement
    client_max_body_size 4m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # sante du conteneur frontend, independante du backend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API : le chemin est transmis tel quel, car les routes du backend commencent par /api.
    # La variable force la resolution a chaque requete et permet de demarrer sans backend.
    location ^~ /api/ {
        set $backend_upstream ${BACKEND_URL};
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # fichiers dont le nom contient une empreinte : contenu immuable, et une erreur 404 s'ils n'existent pas
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # routes Angular : toute URL inconnue renvoie index.html, jamais mis en cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
