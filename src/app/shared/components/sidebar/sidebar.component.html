@if (isOpen()) {
  <div 
    class="fixed inset-0 bg-[#1E1A16]/40 backdrop-blur-sm z-40 lg:hidden"
    (click)="onClose()"
  ></div>
}

<aside 
  class="fixed left-0 top-0 h-full bg-[#FBF8F3] border-r border-[#E8E0D5] z-50 flex flex-col transition-all duration-300 ease-out"
  [class]="asideClasses()"
>
  <!-- Logo + Titre -->
  <div class="p-4 border-b border-[#E8E0D5] flex items-center justify-center" style="height: 72px;">
    @if (isOpen()) {
      <div class="flex items-center gap-3 w-full">
        <div class="w-10 h-10 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <path d="M 10,130 L 170,130 L 170,140 L 10,140 Z" fill="#4A6B7C"/>
            <path d="M 25,75 L 25,130 L 37,130 L 37,75 Z" fill="#4A6B7C"/>
            <path d="M 143,75 L 143,130 L 155,130 L 155,75 Z" fill="#4A6B7C"/>
            <path d="M 15,65 L 90,25 L 165,65 L 150,65 L 90,33 L 30,65 Z" fill="#5B8A72"/>
            <path d="M 52,65 L 52,130 L 64,130 L 64,65 Z" fill="#5B8A72"/>
            <path d="M 116,65 L 116,130 L 128,130 L 128,65 Z" fill="#5B8A72"/>
            <path d="M 90,115 C 78,102 55,100 45,102 L 45,77 C 55,75 78,77 90,90 C 102,77 125,75 135,77 L 135,102 C 125,100 102,102 90,115 Z" fill="#C4A35A"/>
            <rect x="88" y="90" width="4" height="26" fill="#C4A35A"/>
          </svg>
        </div>
        <h1 style="font-size: 1.125rem; font-weight: 700; color: #4A6B7C; font-family: 'Poppins', sans-serif; white-space: nowrap;">
          Internat<span style="color: #5B8A72;">Admin</span>
        </h1>
      </div>
    } @else {
      <div class="w-10 h-10">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
          <path d="M 10,130 L 170,130 L 170,140 L 10,140 Z" fill="#4A6B7C"/>
          <path d="M 25,75 L 25,130 L 37,130 L 37,75 Z" fill="#4A6B7C"/>
          <path d="M 143,75 L 143,130 L 155,130 L 155,75 Z" fill="#4A6B7C"/>
          <path d="M 15,65 L 90,25 L 165,65 L 150,65 L 90,33 L 30,65 Z" fill="#5B8A72"/>
          <path d="M 52,65 L 52,130 L 64,130 L 64,65 Z" fill="#5B8A72"/>
          <path d="M 116,65 L 116,130 L 128,130 L 128,65 Z" fill="#5B8A72"/>
          <path d="M 90,115 C 78,102 55,100 45,102 L 45,77 C 55,75 78,77 90,90 C 102,77 125,75 135,77 L 135,102 C 125,100 102,102 90,115 Z" fill="#C4A35A"/>
          <rect x="88" y="90" width="4" height="26" fill="#C4A35A"/>
        </svg>
      </div>
    }
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-3 space-y-2 overflow-y-auto overflow-x-hidden">
    @for (item of navItems(); track item.route) {
     <a 
        [routerLink]="item.route"
        (click)="onNavClick()"
        class="sidebar-nav-item"
        [class.active]="isActive(item.route)"
        [class.justify-center]="!isOpen()"
        [class.justify-start]="isOpen()"
        [style.padding]="isOpen() ? '16px 20px' : '16px 0'"
        [style.gap]="isOpen() ? '16px' : '0'"
      >
        <app-icon [name]="item.icon" size="w-6 h-6" class="shrink-0"></app-icon>
        
        @if (isOpen()) {
          <span style="white-space: nowrap; letter-spacing: 0.01em; font-size: 16px;">{{ item.label }}</span>
        }
        
        <!-- Tooltip quand sidebar fermée -->
        @if (!isOpen()) {
          <span class="sidebar-tooltip">
            {{ item.label }}
          </span>
        }
      </a>
    }
  </nav>


  <!-- Établissement -->
@if (isOpen() && etablissementNom()) {
  <div class="px-4 py-2 border-t border-[#E8E0D5]">
    <p style="font-size: 0.7rem; color: #B8A88F; text-transform: uppercase; letter-spacing: 0.03em;">Établissement</p>
    <p style="font-size: 0.8rem; color: #5C534A; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      {{ etablissementNom() }}
    </p>
  </div>
}

  <!-- Logout -->
  <div class="p-3 border-t border-[#E8E0D5]">
    <button 
      (click)="logout()"
      class="sidebar-nav-item sidebar-logout"
      [class.justify-center]="!isOpen()"
      [class.justify-start]="isOpen()"
      [style.padding]="isOpen() ? '16px 20px' : '16px 0'"
      [style.gap]="isOpen() ? '16px' : '0'"
    >
      <app-icon name="log-out" size="w-6 h-6" class="shrink-0"></app-icon>
      
      @if (isOpen()) {
        <span style="white-space: nowrap; letter-spacing: 0.01em; font-size: 16px;">Deconnexion</span>
      }
      
      @if (!isOpen()) {
        <span class="sidebar-tooltip">
          Deconnexion
        </span>
      }
    </button>
  </div>
</aside>
