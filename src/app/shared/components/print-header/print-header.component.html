@if (infos(); as e) {
  <div style="display: flex; align-items: center; gap: 1rem; border-bottom: 2px solid #333; padding-bottom: 1rem; margin-bottom: 1.5rem;">
    @if (logoSrc()) {
      <img [src]="logoSrc()" alt="Logo" style="width: 56px; height: 56px; object-fit: contain;">
    }
    <div>
      <p style="font-weight: 700; font-size: 1.1rem;">{{ e.name }}</p>
      @if (e.address) { <p style="font-size: 0.8rem;">{{ e.address }}</p> }
      <p style="font-size: 0.8rem;">
        @if (e.phone) { {{ e.phone }} }
        @if (e.phone && e.email) { — }
        @if (e.email) { {{ e.email }} }
      </p>
    </div>
  </div>
}
