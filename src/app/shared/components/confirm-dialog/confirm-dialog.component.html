@if (request(); as req) {
  <div class="modal-overlay" (click)="cancel()">
    <div class="modal-content" style="max-width: 26rem;" (click)="$event.stopPropagation()">
      <h3 class="text-lg font-semibold text-sand-800 mb-2 font-[family-name:var(--font-display)]">{{ req.title }}</h3>
      <p class="text-sand-600 text-sm mb-6">{{ req.message }}</p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn-secondary" (click)="cancel()">{{ req.cancelLabel }}</button>
        <button type="button" [class]="req.danger ? 'btn-danger' : 'btn-primary'" (click)="confirm()">{{ req.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
