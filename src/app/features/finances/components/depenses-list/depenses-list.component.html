@if (loading()) {
  <div class="card text-center py-12 text-sand-400">Chargement des dépenses...</div>
} @else {
  <app-data-table
    [columns]="columns"
    [data]="data()"
    [defaultSortKey]="'id'"
    [defaultSortDirection]="'desc'"
    exportFileName="depenses"
    emptyMessage="Aucune dépense pour cette période"
  >
    <ng-template #actions let-row>
      @if (row.status === 'VALIDE') {
        <div class="flex gap-1 justify-end items-center">
          <button
            type="button"
            class="p-2 rounded-lg text-sand-500 hover:bg-sand-100 transition-colors"
            (click)="onReceipt(row)"
            title="Voir le reçu"
          >
            <app-icon name="receipt" size="w-4 h-4"></app-icon>
          </button>
          <button
            type="button"
            class="p-2 rounded-lg text-earth-500 hover:bg-earth-50 transition-colors"
            (click)="onCancel(row)"
            title="Annuler"
          >
            <app-icon name="x" size="w-4 h-4"></app-icon>
          </button>
        </div>
      } @else {
        <app-status-badge status="ANNULE"></app-status-badge>
      }
    </ng-template>
  </app-data-table>
}
