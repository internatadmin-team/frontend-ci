<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">
  
  @if (errorMessage) {
    <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; border-radius: 0.75rem; background: rgba(138, 74, 62, 0.2); border: 1px solid rgba(166, 93, 77, 0.3); color: #D4A098; font-size: 0.875rem;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ errorMessage }}
    </div>
  }

  <!-- Username -->
  <div style="display: flex; flex-direction: column; gap: 0.375rem;">
    <label for="username" style="font-size: 0.875rem; font-weight: 500; color: rgba(255,255,255,0.8);">Nom d'utilisateur</label>
    <div style="position: relative;">
      <div style="position: absolute; top: 0; bottom: 0; left: 0; padding-left: 0.75rem; display: flex; align-items: center; pointer-events: none;">
        <svg style="width: 1.25rem; height: 1.25rem; color: #C4A35A;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Entrez votre identifiant"
        style="width: 100%; padding-left: 2.5rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; border-radius: 0.75rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1rem; outline: none; transition: all 0.2s;"
        [style.border-color]="submitted && username?.invalid ? '#A65D4D' : 'rgba(255,255,255,0.2)'"
      >
    </div>
    @if (submitted && username?.invalid) {
      <span style="font-size: 0.75rem; color: #D4A098;">L'identifiant est requis</span>
    }
  </div>

  <!-- Password -->
  <div style="display: flex; flex-direction: column; gap: 0.375rem;">
    <label for="password" style="font-size: 0.875rem; font-weight: 500; color: rgba(255,255,255,0.8);">Mot de passe</label>
    <div style="position: relative;">
      <div style="position: absolute; top: 0; bottom: 0; left: 0; padding-left: 0.75rem; display: flex; align-items: center; pointer-events: none;">
        <svg style="width: 1.25rem; height: 1.25rem; color: #C4A35A;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Entrez votre mot de passe"
        style="width: 100%; padding-left: 2.5rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; border-radius: 0.75rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1rem; outline: none; transition: all 0.2s;"
        [style.border-color]="submitted && password?.invalid ? '#A65D4D' : 'rgba(255,255,255,0.2)'"
      >
    </div>
    @if (submitted && password?.invalid) {
      <span style="font-size: 0.75rem; color: #D4A098;">Le mot de passe est requis</span>
    }
  </div>

  <!-- Forgot password
  <div style="display: flex; justify-content: flex-end;">
    <a href="#" style="font-size: 0.875rem; color: #C4A35A; text-decoration: none;">Mot de passe oublie ?</a>
  </div>  -->

  <!-- Submit -->
  <button
    type="submit"
    [disabled]="loading"
    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.875rem 1rem; background-color: #C4A35A; color: white; font-weight: 600; font-size: 1rem; border-radius: 0.75rem; border: none; cursor: pointer; transition: all 0.2s;"
    [style.opacity]="loading ? '0.6' : '1'"
    [style.cursor]="loading ? 'not-allowed' : 'pointer'"
  >
    @if (loading) {
      <svg style="width: 1.25rem; height: 1.25rem; animation: spin 1s linear infinite;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>Connexion en cours...</span>
    } @else {
      <span>Se connecter</span>
    }
  </button>
</form>
