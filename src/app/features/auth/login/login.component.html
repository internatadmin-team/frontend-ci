<app-login-background></app-login-background>

<div class="relative z-50 min-h-screen flex items-center justify-center p-4" (click)="onContainerClick($event)">
  <div class="w-full max-w-[420px]">
    
    @if (view === 'welcome') {
      <!-- ACCUEIL -->
      <div class="rounded-2xl p-8 md:p-10 text-center" style="background: rgba(30, 26, 22, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);">
        
        <div class="mx-auto mb-5 w-20 h-20">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <path d="M 10,130 L 170,130 L 170,140 L 10,140 Z" fill="#4A6B7C"/>
            <path d="M 25,75 L 25,130 L 37,130 L 37,75 Z" fill="#4A6B7C"/>
            <path d="M 143,75 L 143,130 L 155,130 L 155,75 Z" fill="#4A6B7C"/>
            <path d="M 15,65 L 90,25 L 165,65 L 150,65 L 90,33 L 30,65 Z" fill="#5B8A72"/>
            <path d="M 52,65 L 52,130 L 64,130 L 64,65 Z" fill="#5B8A72"/>
            <path d="M 116,65 L 116,130 L 128,130 L 128,65 Z" fill="#5B8A72"/>
            <path d="M 90,115 C 78,102 55,100 45,102 L 45,77 C 55,75 78,77 90,90 C 102,77 125,75 135,77 L 135,102 C 125,100 102,102 90,115 Z" fill="#C4A35A"/>
            <rect x="88" y="90" width="4" height="26" fill="#C4A35A"/>
          </svg>
        </div>

        <h1 class="text-4xl md:text-5xl font-bold mb-2 tracking-tight" style="color: #C4A35A; font-family: 'Poppins', sans-serif;">
          InternatAdmin
        </h1>

        <p class="text-white/90 text-lg md:text-xl mb-1">
          Application de gestion de l'internat coranique
        </p>

        <p class="text-white/50 text-sm mb-8 tracking-wide">
          Eleves · Finances · Personnel · Rapports
        </p>

        <button
          (click)="showLogin()"
          class="w-full py-3.5 px-6 text-white font-semibold text-lg rounded-xl transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg active:scale-[0.98]"
          style="background-color: #5B8A72;"
          onmouseover="this.style.backgroundColor='#4A6E5A'"
          onmouseout="this.style.backgroundColor='#5B8A72'"
        >
          Se connecter
        </button>
      </div>
    }

    @if (view === 'login') {
      <!-- FORMULAIRE CONNEXION -->
      <div 
        class="rounded-2xl p-8 md:p-10 relative"
        style="background: rgba(30, 26, 22, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1);"
        (click)="$event.stopPropagation()"
      >
        <div class="mx-auto mb-4 w-16 h-16">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <path d="M 10,130 L 170,130 L 170,140 L 10,140 Z" fill="#4A6B7C"/>
            <path d="M 25,75 L 25,130 L 37,130 L 37,75 Z" fill="#4A6B7C"/>
            <path d="M 143,75 L 143,130 L 155,130 L 155,75 Z" fill="#4A6B7C"/>
            <path d="M 15,65 L 90,25 L 165,65 L 150,65 L 90,33 L 30,65 Z" fill="#5B8A72"/>
            <path d="M 52,65 L 52,130 L 64,130 L 64,65 Z" fill="#5B8A72"/>
            <path d="M 116,65 L 116,130 L 128,130 L 128,65 Z" fill="#5B8A72"/>
            <path d="M 90,115 C 78,102 55,100 45,102 L 45,77 C 55,75 78,77 90,90 C 102,77 125,75 135,77 L 135,102 C 125,100 102,102 90,115 Z" fill="#C4A35A"/>
            <rect x="88" y="90" width="4" height="26" fill="#C4A35A"/>
          </svg>
        </div>

        <h2 class="text-2xl font-bold mb-1 text-center tracking-tight" style="color: #C4A35A; font-family: 'Poppins', sans-serif;">
          InternatAdmin
        </h2>
        <p class="text-white/60 text-sm mb-6 text-center">Connexion a votre compte</p>

       <app-login-form (loginSubmit)="onLogin($event)"></app-login-form>

        <div class="mt-4 text-center">
          <button
            (click)="showRecovery()"
            style="font-size: 0.875rem; color: #C4A35A; background: none; border: none; cursor: pointer; text-decoration: underline;"
          >
            Mot de passe oublie ? (Admin uniquement)
          </button>
        </div>
      </div>
    }

    @if (view === 'recovery') {
      <!-- FORMULAIRE RECUPERATION -->
      <div 
        class="rounded-2xl p-8 md:p-10 relative"
        style="background: rgba(30, 26, 22, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1);"
        (click)="$event.stopPropagation()"
      >
        <div class="mx-auto mb-4 w-16 h-16">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <path d="M 10,130 L 170,130 L 170,140 L 10,140 Z" fill="#4A6B7C"/>
            <path d="M 25,75 L 25,130 L 37,130 L 37,75 Z" fill="#4A6B7C"/>
            <path d="M 143,75 L 143,130 L 155,130 L 155,75 Z" fill="#4A6B7C"/>
            <path d="M 15,65 L 90,25 L 165,65 L 150,65 L 90,33 L 30,65 Z" fill="#5B8A72"/>
            <path d="M 52,65 L 52,130 L 64,130 L 64,65 Z" fill="#5B8A72"/>
            <path d="M 116,65 L 116,130 L 128,130 L 128,65 Z" fill="#5B8A72"/>
            <path d="M 90,115 C 78,102 55,100 45,102 L 45,77 C 55,75 78,77 90,90 C 102,77 125,75 135,77 L 135,102 C 125,100 102,102 90,115 Z" fill="#C4A35A"/>
            <rect x="88" y="90" width="4" height="26" fill="#C4A35A"/>
          </svg>
        </div>

        <h2 class="text-2xl font-bold mb-1 text-center tracking-tight" style="color: #C4A35A; font-family: 'Poppins', sans-serif;">
          Recuperation
        </h2>
        <p class="text-white/60 text-sm mb-6 text-center">Admin : utilisez votre code de recuperation</p>

        <app-recovery-form (back)="showWelcome()" (success)="onRecoverySuccess()"></app-recovery-form>
      </div>
    }

  </div>
</div>
